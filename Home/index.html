<!DOCTYPE html>
<html lang="it" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="" id="meta-description">
    <title>MathiasGGxMitic</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://bio.mathiasggxmitic.it" crossorigin>
    <link rel="preconnect" href="https://projects.mathiasggxmitic.it" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap&font-display=swap" rel="stylesheet">
    <link rel="stylesheet" href="CSS/index-style.css">
    <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"></noscript>
    <script>
        (() => {
            const params = new URLSearchParams(window.location.search);
            if (params.get("transition") === "bio-to-home") document.documentElement.classList.add("transition-enter");
        })();
    </script>
</head>
<body>
    <header class="navbar" id="home-navbar">
        <div class="navbar-bar">
            <span class="brand"><span class="brand-prefix">~/</span>MathiasGGxMitic</span>
            <div class="lang-menu-wrapper">
                <button class="lang-btn" id="lang-btn" type="button" data-i18n-attr="aria-label:langBtnAriaLabel" aria-label="">
                    <span class="lang-flag" id="lang-flag-current"></span>
                    <span class="lang-text" id="lang-code-current"></span>
                    <i class="fa-solid fa-chevron-down" id="lang-chevron"></i>
                </button>
            </div>
        </div>
        <div class="lang-dropdown" id="lang-dropdown">
            <a href="#" data-lang="it" class="lang-option"><span class="lang-flag"></span> <span data-i18n="langNameIt"></span></a>
            <div class="menu-divider"></div>
            <a href="#" data-lang="en" class="lang-option"><span class="lang-flag"></span> <span data-i18n="langNameEn"></span></a>
            <div class="menu-divider"></div>
            <a href="#" data-lang="es" class="lang-option"><span class="lang-flag"></span> <span data-i18n="langNameEs"></span></a>
        </div>
    </header>
    <main id="home-main">
        <section class="panel">
            <div class="panel-header">
                <span class="panel-title" data-i18n="panelTitle"></span>
            </div>
            <div class="panel-body">
                <div class="launcher-label" data-i18n="launcherLabel"></div>
                <div class="launcher">
                    <button class="app-tile" type="button" data-app="bio">
                        <span class="app-icon app-icon-bio"><i class="fa-solid fa-user"></i></span>
                        <span class="app-label" data-i18n="appBio"></span>
                    </button>
                    <button class="app-tile" type="button" data-app="projects">
                        <span class="app-icon app-icon-projects"><i class="fa-solid fa-folder-open"></i></span>
                        <span class="app-label" data-i18n="appProjects"></span>
                        <span class="app-status"><i class="dot-idle"></i><span data-i18n="statusSoon"></span></span>
                    </button>
                    <button class="app-tile" type="button" data-app="soon" aria-disabled="true">
                        <span class="app-icon app-icon-soon"><i class="fa-solid fa-screwdriver-wrench"></i></span>
                        <span class="app-label app-label-dim" data-i18n="appSoon"></span>
                    </button>
                </div>
            </div>
        </section>
        <footer class="log-note">
            <p><span class="log-tag">[INFO]</span><span data-i18n="footerInfo"></span></p>
        </footer>
    </main>
    <div class="page-transition" id="page-transition" aria-hidden="true" hidden></div>
    <script src="JS/index-script.js"></script>
</body>
</html>
